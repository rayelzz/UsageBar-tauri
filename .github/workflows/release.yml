name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: UsageBar v__VERSION__
          releaseBody: |
            ### What’s new

            - **Transparent style matches the dark bar:** same large rings, percents, and gear; only the dock is gone.
            - **Settings apply again:** snap to an edge, lock position, and switch display style without closing the gear panel.
            - **Providers window is only providers.** Display value stays on the gear menu.
            - **Bottom-edge hover card** stays a fixed distance from the bar when switching providers.

            See [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md) for the full history.

            ### Download

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe`
            - **Linux:** `.AppImage` or `.deb`

            macOS builds are ad-hoc signed (not notarized). After copying `UsageBar.app` to Applications, run:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            The “app is damaged” dialog is Gatekeeper quarantine, not a broken file. Do not move it to the Trash.

            ---

            ### 更新说明

            - **透明样式与黑色模式一致：** 大圆环、百分比和齿轮都在，只去掉黑底托。
            - **设置重新生效：** 贴边、锁定位置可用；切换显示样式时齿轮面板保持打开。
            - **提供商窗口只管提供商。** 显示值只留在齿轮菜单。
            - **贴下边时详情卡**换供应商后仍与主条保持固定间距。

            完整记录见 [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md)。

            ### 下载

            - **macOS 苹果芯片（M 系列）：** `aarch64.dmg`
            - **macOS Intel：** `x64.dmg`
            - **Windows：** `x64-setup.exe`
            - **Linux：** `.AppImage` 或 `.deb`

            macOS 第一次请先拖到「应用程序」，再在终端执行：

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            弹「已损坏」是隔离标记，不是文件坏了。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
