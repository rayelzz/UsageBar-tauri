name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: UsageBar v__VERSION__
          releaseBody: |
            ### What’s new

            - **Settings persist across restarts and updates** ([#1](https://github.com/rayelzz/UsageBar-tauri/issues/1)): position, providers and order, and every other preference in `~/.usagebar/prefs.json`.
            - Incomplete or renamed-monitor prefs no longer reset the bar.

            See [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md) for the full history.

            ### Download

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe`
            - **Linux:** `.AppImage` or `.deb`

            macOS builds are ad-hoc signed (not notarized). After copying `UsageBar.app` to Applications, run:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            The “app is damaged” dialog is Gatekeeper quarantine, not a broken file. Do not move it to the Trash.

            ---

            ### 更新说明

            - **重启和更新后保留全部设置**（[#1](https://github.com/rayelzz/UsageBar-tauri/issues/1)）：位置、提供商个数和顺序，以及其它偏好都在 `~/.usagebar/prefs.json`。
            - 配置缺字段或显示器改名时，不再把条重置回默认位置。

            完整记录见 [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md)。

            ### 下载

            - **macOS 苹果芯片（M 系列）：** `aarch64.dmg`
            - **macOS Intel：** `x64.dmg`
            - **Windows：** `x64-setup.exe`
            - **Linux：** `.AppImage` 或 `.deb`

            macOS 第一次请先拖到「应用程序」，再在终端执行：

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            弹「已损坏」是隔离标记，不是文件坏了。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
