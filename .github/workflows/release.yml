name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: UsageBar v__VERSION__
          releaseBody: |
            ### What’s new

            - **Update reminder.** About once an hour (and on launch), UsageBar checks GitHub Releases. If a newer version exists, a single line appears: **Update available x.x.x**. Click it to open the latest release page. No auto-download.
            - **Quota reset.** When a usage window drops from a used percent back to **0%**, that tool’s icon pulses green and a tooltip stays up with **Quota reset**. Hover the card to reveal **×**, click to dismiss. It does not auto-close.
            - **1–10 tools, bar resizes.** **Tools…** now accepts 1–10 rings (was a fixed 4 with empty **—** slots). The bar shortens or lengthens with the selection. At least one tool must stay checked.
            - Still official APIs only. Sign in on this computer first. Unsigned-in tools show No data.

            ### Download

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe`
            - **Linux:** `.AppImage` or `.deb`

            macOS builds are ad-hoc signed (not notarized). After copying `UsageBar.app` to Applications, run:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            The “app is damaged” dialog is Gatekeeper quarantine, not a broken file. Do not move it to the Trash.

            ---

            ### 更新说明

            - **更新提醒。** 启动时以及大约每小时检查一次 GitHub Releases。有新版本时显示一行「有新版本 x.x.x」，点击打开发布页。不会自动下载。
            - **额度重置提醒。** 某个窗口从已用百分比回到 **0%** 时，该槽位图标绿灯闪动，并弹出「额度已重置」。鼠标悬停气泡出现 **×**，点了才关闭，不会自动收起。
            - **1–10 个工具，条长自适应。** **工具…** 可勾 1–10 个（不再固定 4 格、不再留空的 —）。条随数量变短或变长，至少保留 1 个。
            - 仍然只读本机登录态、只打官方接口。没登录显示暂无数据。

            ### 下载

            - **macOS 苹果芯片（M 系列）：** `aarch64.dmg`
            - **macOS Intel：** `x64.dmg`
            - **Windows：** `x64-setup.exe`
            - **Linux：** `.AppImage` 或 `.deb`

            macOS 第一次请先拖到「应用程序」，再在终端执行：

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            弹「已损坏」是隔离标记，不是文件坏了。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
