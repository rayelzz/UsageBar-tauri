name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: UsageBar v__VERSION__
          # What’s new / 更新说明 / Что нового are shown in the in-app update card.
          # Keep those sections short. Put download / xattr / Gatekeeper
          # text only under Download / 下载 / Скачать, never in the notes sections.
          releaseBody: |
            ### What’s new

            - Add a guided multilingual Windows installer with an explicit Start with Windows option and no automatic post-install launch.
            - Show the session / 5-hour and weekly quotas together as two compact values, with per-provider Auto or explicit metric selection.
            - Add cached quota summaries and full controls to the tray, Russian localization, and edge-aware cards for every dock position.
            - Improve current ZCode/z.ai, GitHub Copilot, and Windows Gemini Desktop session discovery while preserving every existing provider.

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for the full history.

            ### Download

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe` (guided installer)
            - **Linux:** `.AppImage` or `.deb`

            macOS builds are ad-hoc signed (not notarized). After copying `UsageBar.app` to Applications, run:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            The “app is damaged” dialog is Gatekeeper quarantine, not a broken file. Do not move it to the Trash.

            ---

            ### 更新说明

            - 新增多语言 Windows 安装向导，可明确选择随 Windows 启动，并且安装完成后不会自动运行应用。
            - 同时显示会话 / 5 小时与周额度两个紧凑数字，并可为每个提供商使用自动或明确的额度窗口选择。
            - 托盘加入缓存额度摘要和完整控制，新增俄语界面，所有贴边方向的卡片都会朝屏幕内侧打开。
            - 改进新版 ZCode/z.ai、GitHub Copilot 与 Windows Gemini Desktop 会话发现，同时保留全部现有提供商。

            完整记录见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。

            ### 下载

            - **macOS 苹果芯片（M 系列）：** `aarch64.dmg`
            - **macOS Intel：** `x64.dmg`
            - **Windows：** `x64-setup.exe`（引导式安装程序）
            - **Linux：** `.AppImage` 或 `.deb`

            macOS 第一次请先拖到「应用程序」，再在终端执行：

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            弹「已损坏」是隔离标记，不是文件坏了。

            ---

            ### Что нового

            - Добавлен полноценный многоязычный мастер установки Windows с выбором автозапуска и без автоматического запуска приложения после установки.
            - Одновременно показываются два компактных значения: текущая/5-часовая сессия и недельный лимит. Для каждого провайдера доступны автоматический или явный выбор окон.
            - В трее появились сводка лимитов и полное управление, добавлена русская локализация, а карточки открываются внутрь экрана при любом положении панели.
            - Улучшено определение актуальных сессий ZCode/z.ai, GitHub Copilot и Gemini Desktop в Windows без удаления существующих провайдеров.

            Полная история — в [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).

            ### Скачать

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe` (мастер установки)
            - **Linux:** `.AppImage` или `.deb`

            Сборки macOS подписаны ad-hoc и не нотарифицированы Apple. После копирования `UsageBar.app` в Applications выполните:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            Сообщение о повреждении приложения означает карантин Gatekeeper, а не повреждённый файл.
          releaseDraft: false
          prerelease: false
          # Upstream uses its updater signing secret. Forks without that secret
          # still publish installable, unsigned packages on their Releases page.
          args: ${{ matrix.args }} ${{ secrets.TAURI_SIGNING_PRIVATE_KEY == '' && '--no-sign' || '' }}
