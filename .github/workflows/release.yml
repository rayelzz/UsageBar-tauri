name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: UsageBar v__VERSION__
          # What’s new / 更新说明 are shown in the in-app update card.
          # Keep those two sections short. Put download / xattr / Gatekeeper
          # text only under Download / 下载, never in the notes sections.
          releaseBody: |
            ### What’s new

            - **Opacity and blur:** Gear-menu sliders (default: opaque, no blur). Below 60% opacity, text goes dark. macOS frost follows the bar and rounded cards — no extra square, ghost panel, or full-screen smear.
            - **Settings stay in the popover:** Providers, look sliders, and **×** to close. Hovering **×** no longer highlights Refresh now.
            - **Wider top/bottom cards** for long model names. Update check reads `latest.json` so GitHub API limits do not fail the gear check.

            See [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md) for the full history.

            ### Download

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe`
            - **Linux:** `.AppImage` or `.deb`

            macOS builds are ad-hoc signed (not notarized). After copying `UsageBar.app` to Applications, run:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            The “app is damaged” dialog is Gatekeeper quarantine, not a broken file. Do not move it to the Trash.

            ---

            ### 更新说明

            - **不透明度和模糊：** 齿轮菜单里两个滑条（默认不透明、不模糊）。不透明度低于 60% 时字变深。macOS 毛玻璃贴着条和圆角卡片，不再多出方块、第二块面板或整屏糊。
            - **设置仍在弹出层：** 提供商、外观滑条，右上角 **×** 关闭。鼠标在 × 上时不会高亮「立即刷新」。
            - **贴顶 / 贴底详情会加宽。** 检测更新先读 `latest.json`，不再被 GitHub API 限流打成失败。

            完整记录见 [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md)。

            ### 下载

            - **macOS 苹果芯片（M 系列）：** `aarch64.dmg`
            - **macOS Intel：** `x64.dmg`
            - **Windows：** `x64-setup.exe`
            - **Linux：** `.AppImage` 或 `.deb`

            macOS 第一次请先拖到「应用程序」，再在终端执行：

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            弹「已损坏」是隔离标记，不是文件坏了。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
