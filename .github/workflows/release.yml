name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: UsageBar v__VERSION__
          releaseBody: |
            ### What’s new

            - **Click to install updates:** after Check for update, click the new version to download, install, and restart.
            - **Reset notices only for surprise resets.** Scheduled 0% rollovers no longer prompt.
            - **Smoother hover card** when switching providers.

            See [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md) for the full history.

            ### Download

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe`
            - **Linux:** `.AppImage` or `.deb`

            macOS builds are ad-hoc signed (not notarized). After copying `UsageBar.app` to Applications, run:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            The “app is damaged” dialog is Gatekeeper quarantine, not a broken file. Do not move it to the Trash.

            ---

            ### 更新说明

            - **点一下安装更新：** 检测后点新版本号即可下载、安装并重启。
            - **只有突然重置才提示。** 到点归零不再弹「额度已重置」。
            - **换供应商时详情卡**整块滑过去。

            完整记录见 [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md)。

            ### 下载

            - **macOS 苹果芯片（M 系列）：** `aarch64.dmg`
            - **macOS Intel：** `x64.dmg`
            - **Windows：** `x64-setup.exe`
            - **Linux：** `.AppImage` 或 `.deb`

            macOS 第一次请先拖到「应用程序」，再在终端执行：

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            弹「已损坏」是隔离标记，不是文件坏了。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
