name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - run: npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: UsageBar v__VERSION__
          # What’s new / 更新说明 are shown in the in-app update card.
          # Keep those two sections short. Put download / xattr / Gatekeeper
          # text only under Download / 下载, never in the notes sections.
          releaseBody: |
            ### What’s new

            - **Reset-card expiry:** When a card enters 1 day left, then 5 / 4 / 3 / 2 / 1 hours, the icon pulses and a 30-second card appears. Hover or **×** dismisses that milestone. Expiry text turns yellow at ≤ 1 day, red at ≤ 8 hours.
            - **Update notes:** A new version opens a separate window with this section in the app language, beside the settings menu. Opening settings still checks once when auto-check is off. **×** skips that version.

            See [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md) for the full history.

            ### Download

            - **macOS Apple Silicon (M1/M2/M3/M4):** `aarch64.dmg`
            - **macOS Intel:** `x64.dmg`
            - **Windows:** `x64-setup.exe`
            - **Linux:** `.AppImage` or `.deb`

            macOS builds are ad-hoc signed (not notarized). After copying `UsageBar.app` to Applications, run:

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            The “app is damaged” dialog is Gatekeeper quarantine, not a broken file. Do not move it to the Trash.

            ---

            ### 更新说明

            - **重置卡临期：** 进入到期前 1 天，以及 5 / 4 / 3 / 2 / 1 小时时，图标闪动并弹出 30 秒提醒。悬停或点 **×** 关闭该档。到期时间 ≤1 天变黄、≤8 小时变红。
            - **更新说明：** 新版本用独立窗口按应用语言显示本段，不顶掉设置。未开自动检测时，打开设置仍会查一次。点 **×** 跳过该版本。

            完整记录见 [CHANGELOG.md](https://github.com/rayelzz/UsageBar-tauri/blob/main/CHANGELOG.md)。

            ### 下载

            - **macOS 苹果芯片（M 系列）：** `aarch64.dmg`
            - **macOS Intel：** `x64.dmg`
            - **Windows：** `x64-setup.exe`
            - **Linux：** `.AppImage` 或 `.deb`

            macOS 第一次请先拖到「应用程序」，再在终端执行：

            ```
            xattr -cr /Applications/UsageBar.app
            open /Applications/UsageBar.app
            ```

            弹「已损坏」是隔离标记，不是文件坏了。
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
