name: Cross-platform build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: --bundles msi,nsis
          - name: Linux x64
            platform: ubuntu-22.04
            args: --bundles deb,appimage
          - name: macOS Apple Silicon
            platform: macos-latest
            args: --target aarch64-apple-darwin --bundles dmg,app
          - name: macOS Intel
            platform: macos-latest
            args: --target x86_64-apple-darwin --bundles dmg,app

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - run: npm ci
      - run: npm test
      - run: cargo test --manifest-path src-tauri/Cargo.toml
      - run: npm run build -- ${{ matrix.args }} --no-sign

      - name: Upload unsigned packages
        uses: actions/upload-artifact@v4
        with:
          name: usagebar-${{ matrix.name }}
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/**
            src-tauri/target/release/bundle/nsis/**
            src-tauri/target/release/bundle/deb/**
            src-tauri/target/release/bundle/appimage/**
            src-tauri/target/*/release/bundle/dmg/**
            src-tauri/target/*/release/bundle/macos/**
